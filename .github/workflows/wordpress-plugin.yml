name: WordPress-plugin

on:
  push:
    branches: [main]
    paths:
      - 'wordpress-plugin/**'
      - '.github/workflows/wordpress-plugin.yml'
    tags:
      - 'wp-v*'
  pull_request:
    paths:
      - 'wordpress-plugin/**'
      - '.github/workflows/wordpress-plugin.yml'

jobs:
  test:
    name: Controleren
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP-syntax
        run: find wordpress-plugin -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript-syntax
        run: node --check wordpress-plugin/assets/widget.js

      - name: Tests Asana-koppeling
        run: php wordpress-plugin/tests/asana-sync-test.php

  release:
    name: Release (installeerbare zip)
    needs: test
    if: startsWith(github.ref, 'refs/tags/wp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Versie in plugin moet gelijk zijn aan tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#wp-v}"
          PLUGIN_VERSION=$(grep -m1 -oP 'Version:\s*\K[0-9.]+' wordpress-plugin/site-feedback.php)
          echo "Tag: $TAG_VERSION  Plugin: $PLUGIN_VERSION"
          test "$TAG_VERSION" = "$PLUGIN_VERSION"

      - name: Zip bouwen
        run: |
          mkdir -p build/site-feedback
          rsync -a --exclude tests wordpress-plugin/ build/site-feedback/
          cd build && zip -rq ../site-feedback.zip site-feedback

      - name: GitHub-release aanmaken
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" site-feedback.zip --title "WordPress-plugin ${GITHUB_REF_NAME#wp-v}" --generate-notes
